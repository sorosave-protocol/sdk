name: Deploy to Mainnet

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "mainnet" to confirm this deployment'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

jobs:
  test:
    name: Full test suite
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'mainnet' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies
        run: pnpm install
      - name: Build SDK
        run: pnpm build
      - name: Run tests
        run: pnpm test

  deploy:
    name: Deploy to Stellar mainnet
    runs-on: ubuntu-latest
    needs: test
    # Configure required reviewers on the "mainnet" environment to enforce manual approval.
    environment: mainnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Configure mainnet network and signing key
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          MAINNET_SECRET_KEY: ${{ secrets.MAINNET_SECRET_KEY }}
        run: |
          stellar network add mainnet \
            --rpc-url "$MAINNET_RPC_URL" \
            --network-passphrase "Public Global Stellar Network ; September 2015"
          echo "$MAINNET_SECRET_KEY" | stellar keys add alice --secret-key

      - name: Deploy contract
        id: deploy
        run: |
          set -o pipefail
          bash scripts/deploy.sh mainnet | tee deploy.log
          CONTRACT_ID=$(grep -E '^Contract ID: ' deploy.log | tail -n 1 | sed 's/^Contract ID: //')
          if [ -z "$CONTRACT_ID" ]; then
            echo "Could not determine contract ID from deploy output"
            exit 1
          fi
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"

      - name: Post-Deployment Verification
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
        run: |
          stellar contract fetch --id "$CONTRACT_ID" --network mainnet --out-file verify.wasm
          if [ ! -s verify.wasm ]; then
            echo "Verification failed: deployed WASM for $CONTRACT_ID is missing or empty"
            exit 1
          fi
          echo "Verified contract $CONTRACT_ID on mainnet ($(wc -c < verify.wasm) bytes)"
          echo "### Mainnet deployment verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Contract ID: \`$CONTRACT_ID\`" >> "$GITHUB_STEP_SUMMARY"
